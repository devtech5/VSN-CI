version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vsn_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vsn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vsn_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vsn_ci_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vsn_network

  redis:
    image: redis:7-alpine
    container_name: vsn_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - vsn_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vsn_backend
    restart: always
    env_file: .env
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis
    networks:
      - vsn_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vsn_frontend
    restart: always
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - vsn_network

volumes:
  postgres_data:
  redis_data:

networks:
  vsn_network:
    driver: bridge
